# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Every build type the project defines, on x86_64 and arm64, with both
      # compilers. RelWithDebInfo and MinSizeRel are here because they define
      # NDEBUG, which Release also does but Debug, Tsan and Asan do not: code
      # that only works with asserts enabled stays broken until something
      # builds it that way.
      # todo: add windows-latest
      matrix:
        os: [ubuntu-latest, ubuntu-22.04-arm]
        build_type: [Release, Debug, RelWithDebInfo, MinSizeRel, Tsan, Asan]
        c_compiler: [gcc, clang]
        exclude:
            - c_compiler: gcc
              build_type: Asan

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DUNIT_TEST=ON
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

  build-macos:
    runs-on: macos-latest

    strategy:
      fail-fast: false

      # Mirror the Ubuntu build matrix: every build type x clang.
      # macOS only ships Apple Clang; gcc is an alias for it on macOS runners.
      matrix:
        build_type: [Release, Debug, RelWithDebInfo, MinSizeRel, Tsan, Asan]

    steps:
    - uses: actions/checkout@v4

    - name: Install GNU coreutils
      # Provides md5sum (used by test scripts) which is absent on macOS by default.
      run: |
        brew install coreutils
        echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DUNIT_TEST=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} -j$(sysctl -n hw.ncpu)

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }}

  build-alpine:
    # musl, not glibc: pthread_t is a pointer there, which this tree has got
    # wrong before (HardySimpson/zlog#280), and nothing else in the matrix
    # would catch it. The build runs in a container rather than as a container
    # job, so actions/checkout keeps running against the host's glibc.
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      # No Tsan or Asan here: alpine's gcc ships no sanitizer runtimes, and
      # thread sanitizer does not support musl at all.
      matrix:
        build_type: [Release, Debug]

    steps:
    - uses: actions/checkout@v4

    - name: Build and test with CMake
      run: |
        docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh -c '
          set -e
          apk add --no-cache build-base cmake bash coreutils
          cp -a /src /work && cd /work && rm -rf build
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DUNIT_TEST=ON
          cmake --build build -j$(nproc)
          cd build && ctest --output-on-failure
        '

    - name: Build with the makefile
      # the makefile build is what broke on alpine in #280, and no other job
      # builds it at all
      run: |
        docker run --rm -v "$PWD:/src:ro" alpine:3.22 sh -c '
          set -e
          apk add --no-cache build-base bash
          cp -a /src /work && cd /work
          make -j$(nproc)
          make -C test -j$(nproc)
        '
